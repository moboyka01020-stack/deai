            fr: { modalTitle: "Choisissez une clinique", cancel: "Annuler", bookConfirm: "✅ Votre demande de réservation à **{clinic}** a été enregistrée avec succès. Nous vous contacterons bientôt !", sidebarTitle: "Historique", newChatText: "Nouveau Chat", emergency: "🚨 Urgence", book: "📅 Réserver", authDesc: "Connectez-vous pour que l'IA conserve votre historique", login: "Connexion", signup: "S'inscrire", toSignup: "Pas de compte ? Créer", toLogin: "Déjà un compte ? Connexion", logout: "🚪 Déconnexion", disclaimer: "Avis: À titre indicatif seulement. Dr. Mohamed Ghalla.", pregnant: "Enceinte", chronic: "Maladie Chro.", allergy: "Allergie", placeholder: "Décrivez vos symptômes...", send: "Envoyer 🚀", welcome: "Bienvenue ! Je suis DEAI. Écrivez votre plainte ou envoyez une photo.", thinking: "Le docteur analyse...", cats: ["⚡ Mal aux dents", "🪥 Soins", "🦷 Appareil"], prompts: ["J'ai mal aux dents", "Comment prendre soin de mes dents ?", "Quels sont les appareils ?"] },
            de: { modalTitle: "Klinik wählen", cancel: "Abbrechen", bookConfirm: "✅ Ihre vorläufige Buchung in der **{clinic}** wurde erfolgreich erfasst. Wir werden Sie bald kontaktieren!", sidebarTitle: "Verlauf", newChatText: "Neuer Chat", emergency: "🚨 Notfall", book: "📅 Termin buchen", authDesc: "Loggen Sie sich ein für den KI-Verlauf", login: "Login", signup: "Registrieren", toSignup: "Kein Konto? Erstellen", toLogin: "Konto vorhanden? Login", logout: "🚪 Ausloggen", disclaimer: "Hinweis: Nur zur Orientierung. Dr. Mohamed Ghalla.", pregnant: "Schwanger", chronic: "Chro. Krank.", allergy: "Allergie", placeholder: "Symptome beschreiben...", send: "Senden 🚀", welcome: "Willkommen! Ich bin DEAI. Schreiben Sie Ihre Beschwerde.", thinking: "Arzt analysiert...", cats: ["⚡ Zahnschmerzen", "🪥 Pflege", "🦷 Zahnspange"], prompts: ["Ich habe Zahnschmerzen", "Tägliche Zahnpflege?", "Arten von Zahnspangen?"] }
        };

        const systemPrompts = {
            ar: `أنت طبيب أسنان ذكي ومحترف تُدعى DEAI. اسأل سؤالين تشخيصيين أولاً. لا تعطي العلاج فوراً. راعِ دائماً 'الحالة الصحية للمريض'. إذا سألك المريض عن من برمجك أو صممك أو من مالكك، أجب بكل فخر أن مبرمجي والمالك الفكري لتقنياتك هو الدكتور محمد غلة (Dr. Mohamed Ghalla)، طبيب أسنان مبدع ورائد في دمج الذكاء الاصطناعي مع الرعاية الصحية. الرد باللغة العربية.`,
            en: `You are a smart dentist named DEAI. Ask 2 diagnostic questions first. Do not give treatment immediately. Always consider 'Medical Condition'. If asked who programmed, designed, or owns you, proudly state that your programmer and the intellectual owner of your technology is Dr. Mohamed Ghalla, an innovative dentist and pioneer in integrating AI with healthcare. English response.`,
            zh: `您是名为 DEAI 的智能专业牙医。先问两个诊断性问题。切勿立即给出治疗。始终考虑“医疗状况”。如果被问及是谁编程、设计或拥有您，请自豪地回答您的程序员和技术的知识产权所有者是 Dr. Mohamed Ghalla，他是一位富有创新精神的牙医，也是将人工智能与医疗保健相结合的先驱。中文回复。`,
            fr: `Vous êtes un dentiste nommé DEAI. Posez d'abord 2 questions. Ne donnez pas de traitement immédiatement. Tenez compte de l'État de Santé. Si on vous demande qui vous a programmé, conçu ou qui est votre propriétaire, répondez fièrement que votre programmeur et le propriétaire intellectuel de votre technologie est le Dr Mohamed Ghalla, un dentiste innovant et pionnier dans l'intégration de l'IA aux soins de santé. Réponse en français.`,
            de: `Sie sind ein Zahnarzt namens DEAI. Stellen Sie zuerst 2 Fragen. Geben Sie nicht sofort eine Behandlung. Berücksichtigen Sie den Gesundheitszustand. Wenn Sie gefragt werden, wer Sie programmiert, entworfen oder wem Sie gehören, antworten Sie stolz, dass Ihr Programmierer und der geistige Eigentümer Ihrer Technologie Dr. Mohamed Ghalla ist, ein innovativer Zahnarzt und Pionier bei der Integration von KI in die Gesundheitsversorgung. Deutsche Antwort.`
        };

        window.openClinicModal = function() {
            document.getElementById('clinicModal').style.display = 'flex';
        };

        window.closeClinicModal = function() {
            document.getElementById('clinicModal').style.display = 'none';
        };

        window.selectClinic = function(clinicName) {
            window.closeClinicModal();
            if(!window.currentChatId) return;
            
            const t = translations[window.currentLang];
            const msg = t.bookConfirm.replace("{clinic}", clinicName);
            
            window.appendMessage(msg, "bot");
            window.chatsData[window.currentChatId].history.push({ role: "assistant", content: msg });
            window.saveDataToFirebase();
        };

        window.findEmergencyClinic = function() {
            const queries = { ar: "اقرب عيادة اسنان طوارئ", en: "nearest emergency dental clinic", zh: "最近的急诊牙科诊所", fr: "clinique dentaire d'urgence la plus proche", de: "nächste zahnärztliche notfallklinik" };
            window.open(`https://www.google.com/maps/search/${encodeURIComponent(queries[window.currentLang])}`, '_blank'); 
        };

        window.openSidebar = function() { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarOverlay').style.display = 'block'; window.renderSidebar(); };
        window.closeSidebar = function() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').style.display = 'none'; };

        window.renderSidebar = function() {
            const list = document.getElementById('chatsList');
            list.innerHTML = '';
            const sortedChats = Object.keys(window.chatsData).sort((a, b) => {
                if (window.chatsData[a].pinned && !window.chatsData[b].pinned) return -1;
                if (!window.chatsData[a].pinned && window.chatsData[b].pinned) return 1;
                return window.chatsData[b].date - window.chatsData[a].date;
            });

            sortedChats.forEach(chatId => {
                const chat = window.chatsData[chatId];
                const item = document.createElement('div');
                item.className = `chat-item ${chatId === window.currentChatId ? 'active' : ''}`;
                item.onclick = () => loadChat(chatId);
                
                item.innerHTML = `
                    <div class="chat-title-text" title="${chat.title}">${chat.title}</div>
                    <div class="chat-actions">
                        <button class="chat-action-btn ${chat.pinned ? 'pinned' : ''}" onclick="event.stopPropagation(); togglePin('${chatId}')" title="تثبيت/إلغاء">📌</button>
                        <button class="chat-action-btn" onclick="event.stopPropagation(); deleteChat('${chatId}')" title="حذف">🗑️</button>
                    </div>
                `;
                list.appendChild(item);
            });
        };

        window.createNewChat = function(autoSave = true) {
            const chatId = "chat_" + Date.now();
            window.chatsData[chatId] = {
                title: translations[window.currentLang].newChatText,
                history: [ { role: "system", content: systemPrompts[window.currentLang] } ],
                pinned: false,
                date: Date.now()
            };
            loadChat(chatId, autoSave);
            if(window.innerWidth < 768) closeSidebar();
        };

        window.loadChat = function(chatId, autoSave = true) {
            window.currentChatId = chatId;
            document.getElementById('chatBox').innerHTML = '';
            
            const history = window.chatsData[chatId].history;
            if (history.length === 1) { 
                window.appendMessage(translations[window.currentLang].welcome, "bot");
            } else {
                history.forEach(msg => {
                    if(msg.role !== 'system') {
                        let cleanText = typeof msg.content === 'string' ? msg.content.replace(/ \[Alert:.*?\]/g, "") : "[صورة مرفقة]";
                        window.appendMessage(cleanText, msg.role === 'user' ? 'user' : 'bot', null, false, true);
                    }
                });
            }
            renderSidebar();
            if(autoSave) window.saveDataToFirebase();
        };

        window.togglePin = function(chatId) { window.chatsData[chatId].pinned = !window.chatsData[chatId].pinned; renderSidebar(); window.saveDataToFirebase(); };
        window.deleteChat = function(chatId) {
            if(confirm("تأكيد الحذف؟ / Delete?")) {
                delete window.chatsData[chatId];
                if (chatId === window.currentChatId) {
                    const remainingChats = Object.keys(window.chatsData);
                    if(remainingChats.length > 0) loadChat(remainingChats[0]);
                    else createNewChat();
                } else { renderSidebar(); }
                window.saveDataToFirebase();
            }
        };

        window.changeLanguage = function(lang) {
            window.currentLang = lang;
            const t = translations[lang];
            
            document.getElementById('authDesc').innerText = t.authDesc;
            document.getElementById('loginBtn').innerText = window.isLoginMode ? t.login : t.signup;
            document.getElementById('authModeText').innerText = window.isLoginMode ? t.toSignup : t.toLogin;
            document.getElementById('sidebarTitle').innerText = t.sidebarTitle;
            document.getElementById('newChatText').innerText = t.newChatText;
            document.getElementById('emergencyBtnText').innerText = t.emergency;
            document.getElementById('bookBtnText').innerText = t.book;
            
            document.getElementById('modalTitleText').innerText = t.modalTitle;
            document.getElementById('cancelModalBtn').innerText = t.cancel;
            
            document.getElementById('htmlTag').dir = (lang === 'ar') ? 'rtl' : 'ltr';
            document.getElementById('htmlTag').lang = lang;
            
            if(lang === 'ar') document.body.style.fontFamily = "var(--font-family-ar)";
            else if(lang === 'zh') document.body.style.fontFamily = "var(--font-family-zh)";
            else document.body.style.fontFamily = "var(--font-family-global)";

            document.getElementById('logoutBtnText').innerText = t.logout;
            document.getElementById('disclaimerText').innerText = t.disclaimer;
            document.getElementById('textPreg').innerText = t.pregnant;
            document.getElementById('textChro').innerText = t.chronic;
            document.getElementById('textAlle').innerText = t.allergy;
            document.getElementById('userInput').placeholder = t.placeholder;
            document.getElementById('sendBtn').innerText = t.send;

            const catsWrapper = document.getElementById('categoriesWrapper');
            catsWrapper.innerHTML = '';
            t.cats.forEach((cat, index) => {
                const btn = document.createElement('button');
                btn.className = 'category-chip';
                btn.innerText = cat;
                btn.onclick = () => sendCategoryPrompt(t.prompts[index]);
                catsWrapper.appendChild(btn);
            });

            if(window.currentChatId && window.chatsData[window.currentChatId]) {
                window.chatsData[window.currentChatId].history[0] = { role: "system", content: systemPrompts[lang] };
            }
        };

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            window.recognition = new SpeechRecognition();
            window.recognition.continuous = false;
            window.recognition.interimResults = false;
            window.recognition.onstart = () => { window.isListening = true; document.getElementById('micBtn').classList.add('mic-recording'); };
            window.recognition.onresult = (event) => {
                document.getElementById('userInput').value = event.results[0][0].transcript;
                setTimeout(() => window.sendMessage(), 500); 
            };
            window.recognition.onend = () => { window.isListening = false; document.getElementById('micBtn').classList.remove('mic-recording'); };
            window.recognition.onerror = () => { window.isListening = false; document.getElementById('micBtn').classList.remove('mic-recording'); };
        }

        window.toggleVoiceInput = function() {
            if (!SpeechRecognition) return alert("Browser does not support speech recognition.");
            if (window.isListening) { window.recognition.stop(); } 
            else {
                const langMap = { ar: 'ar-SA', en: 'en-US', zh: 'zh-CN', fr: 'fr-FR', de: 'de-DE' };
                window.recognition.lang = langMap[window.currentLang];
                window.recognition.start();
            }
        };

        window.speakOutLoud = function(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const cleanText = text.replace(/\*/g, '').replace(/<[^>]*>?/gm, ''); 
                const utterance = new SpeechSynthesisUtterance(cleanText);
                const langMap = { ar: 'ar-SA', en: 'en-US', zh: 'zh-CN', fr: 'fr-FR', de: 'de-DE' };
                utterance.lang = langMap[window.currentLang];
                utterance.rate = 0.9; 
                window.speechSynthesis.speak(utterance);
            }
        };

        window.toggleAuthMode = function() {
            window.isLoginMode = !window.isLoginMode;
            const t = translations[window.currentLang];
            document.getElementById('loginBtn').innerText = window.isLoginMode ? t.login : t.signup;
            document.getElementById('authModeText').innerText = window.isLoginMode ? t.toSignup : t.toLogin;
            document.getElementById('authError').style.display = 'none';
        };

        window.handleAuth = async function() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('authError');
            if(!email || !password) { errorDiv.innerText = "Please fill fields"; errorDiv.style.display = 'block'; return; }
            try {
                if(window.isLoginMode) await signInWithEmailAndPassword(auth, email, password);
                else await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) { errorDiv.innerText = "Error: " + error.message; errorDiv.style.display = 'block'; }
        };

        window.handleLogout = async function() {
            if('speechSynthesis' in window) window.speechSynthesis.cancel();
            await signOut(auth);
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                window.isDataLoaded = false; 

                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                changeLanguage('ar');

                try {
                    const docRef = doc(db, "patients", user.uid);
                    const docSnap = await getDoc(docRef);
                    
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        window.medicalState = data.medicalState || { pregnant: false, chronic: false, allergy: false };
                        
                        document.getElementById('btnPregnant').classList.toggle('active', window.medicalState.pregnant);
                        document.getElementById('btnChronic').classList.toggle('active', window.medicalState.chronic);
                        document.getElementById('btnAllergy').classList.toggle('active', window.medicalState.allergy);

                        if (data.chats && Object.keys(data.chats).length > 0) {
                            window.chatsData = data.chats;
                            const savedCurrent = data.currentChatId;
                            if(savedCurrent && window.chatsData[savedCurrent]) loadChat(savedCurrent, false);
                            else loadChat(Object.keys(window.chatsData)[0], false);
                        } else {
                            window.chatsData = {};
                            createNewChat(false);
                        }
                    } else {
                        window.chatsData = {};
                        createNewChat(false);
                    }
                } catch(err) {
                    console.error("Memory load error:", err);
                    window.chatsData = {};
                    createNewChat(false);
                } finally {
                    window.isDataLoaded = true; 
                }
            } else {
                window.currentUser = null;
                window.isDataLoaded = false;
                document.getElementById('mainApp').style.display = 'none';
                document.getElementById('authScreen').style.display = 'block';
                window.currentLang = 'ar';
                changeLanguage('ar');
            }
        });

        window.saveDataToFirebase = async function() {
            try {
                if(!window.currentUser || !window.isDataLoaded) return;
                const docRef = doc(db, "patients", window.currentUser.uid);
                await setDoc(docRef, { chats: window.chatsData, currentChatId: window.currentChatId, medicalState: window.medicalState }, { merge: true });
            } catch(e) { console.error("Save error:", e); }
        };

        window.toggleMedical = function(type, btn) { window.medicalState[type] = !window.medicalState[type]; btn.classList.toggle('active'); window.saveDataToFirebase(); };
        window.toggleTheme = function() { document.body.classList.toggle("dark-mode"); };
        window.triggerCameraClick = function() { document.getElementById('fileInput').click(); };
        window.sendCategoryPrompt = function(text) { document.getElementById("userInput").value = text; window.sendMessage(); };
        window.handleKeyPress = function(e) { if(e.key === "Enter") window.sendMessage(); };

        window.handleImageUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                window.pendingImageBase64 = e.target.result;
                const imgPrompts = { ar: "أرجو تحليل هذه الصورة.", en: "Analyze this image.", zh: "分析这张图片。", fr: "Analyser cette image.", de: "Analysiere dieses Bild." };
                document.getElementById('userInput').value = imgPrompts[window.currentLang];
                window.sendMessage(); 
            };
            reader.readAsDataURL(file);
        };

        window.sendMessage = async function() {
            try {
                if('speechSynthesis' in window) window.speechSynthesis.cancel();
                
                const userInput = document.getElementById("userInput");
                const sendBtn = document.getElementById("sendBtn");
                const userText = userInput.value.trim();

                if (userText === "" && !window.pendingImageBase64) return;

                if (window.chatsData[window.currentChatId].history.length === 1 && !window.pendingImageBase64) {
                    window.chatsData[window.currentChatId].title = userText.substring(0, 20) + "...";
                    renderSidebar();
                }

                if(window.pendingImageBase64) {
                    const imgHTML = `<div class="uploaded-image-container"><img src="${window.pendingImageBase64}"></div><div>${userText}</div>`;
                    window.appendMessage(imgHTML, "user", null, true); 
                } else { window.appendMessage(userText, "user"); }

                userInput.value = ""; userInput.disabled = true; sendBtn.disabled = true;

                let medContext = ""; let conditions = [];
                const t = translations[window.currentLang];
                if(window.medicalState.pregnant) conditions.push(t.pregnant);
                if(window.medicalState.chronic) conditions.push(t.chronic);
                if(window.medicalState.allergy) conditions.push(t.allergy);
                if(conditions.length > 0) medContext = ` [Alert: ${conditions.join(", ")}]`;

                let modelToUse = "llama-3.3-70b-versatile";
                let historyToSend = [];

                if(window.pendingImageBase64) {
                    modelToUse = "llama-3.2-11b-vision-preview"; 
                    const visionInstruction = (window.currentLang === 'ar') ? "انظر للصورة وشخص الحالة.\n" : "Look at image and diagnose.\n";
                    historyToSend = [ { role: "user", content: [ { type: "text", text: visionInstruction + userText + medContext }, { type: "image_url", image_url: { url: window.pendingImageBase64 } } ] } ];
                    window.chatsData[window.currentChatId].history.push({ role: "user", content: userText + medContext + " [Image]" });
                    window.pendingImageBase64 = null; 
                } else {
                    window.chatsData[window.currentChatId].history.push({ role: "user", content: userText + medContext });
                    historyToSend = [...window.chatsData[window.currentChatId].history];
                }

                window.chatsData[window.currentChatId].date = Date.now();
                window.saveDataToFirebase();
                renderSidebar(); 

                const loadingId = "loading-" + Date.now();
                window.appendMessage(translations[window.currentLang].thinking, "bot", loadingId);

                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${window.GROQ_API_KEY}` },
                    body: JSON.stringify({ model: modelToUse, messages: historyToSend, temperature: 0.3 })
                });

                const data = await response.json();
                if(document.getElementById(loadingId)) document.getElementById(loadingId).remove();

                if (data.choices && data.choices.length > 0) {
                    let aiReply = data.choices[0].message.content;
                    window.appendMessage(aiReply, "bot");
                    window.chatsData[window.currentChatId].history.push({ role: "assistant", content: aiReply });
                    window.saveDataToFirebase();
                } else if (data.error) {
                    window.appendMessage("🛑 خطأ (API Key): " + data.error.message, "bot");
                }
            } catch (error) {
                window.appendMessage(`🛑 عطل: ${error.message}`, "bot");
            } finally {
                document.getElementById("userInput").disabled = false; 
                document.getElementById("sendBtn").disabled = false; 
                document.getElementById("userInput").focus();
            }
        };

        window.appendMessage = function(text, role, id = null, isHtml = false, isHistory = false) {
            const chatBox = document.getElementById("chatBox");
            const wrapperDiv = document.createElement("div");
            wrapperDiv.className = `message-wrapper ${role === 'user' ? 'user-wrapper' : 'bot-wrapper'}`;
            if (id) wrapperDiv.id = id;
            
            let textStr = typeof text === 'string' ? text : JSON.stringify(text);
            const displayCleanText = textStr.replace(/ \[Alert:.*?\]/g, "");
            let formattedText = isHtml ? displayCleanText : displayCleanText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
            const safeSpeakText = displayCleanText.replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, " ");

            wrapperDiv.innerHTML = `
                <div class="avatar">${role === 'user' ? '👤' : '👨‍⚕️'}</div>
                <div class="message-content">
                    ${role === 'bot' ? `<span class="bot-name-label">DEAI <span class="verified-badge">✔️</span></span>` : ''}
                    <div class="message ${role}-message">${formattedText}</div>
                    ${role === 'bot' && !id && !isHtml ? `<button class="speak-btn" onclick="speakOutLoud('${safeSpeakText}')" title="استمع للرد">🔊</button>` : ''}
                </div>
            `;
            chatBox.appendChild(wrapperDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        };
    </script>
</body>
</html>
